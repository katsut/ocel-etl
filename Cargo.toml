[package]
name = "ocel-etl"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/katsut/ocel-etl"
description = "ETL engine for OCEL 2.0 process mining: staging representation with a validation gate"
documentation = "https://docs.rs/ocel-etl"
readme = "README.md"
keywords = ["ocel", "process-mining", "etl", "event-log", "ocel2"]
categories = ["data-structures"]

[dependencies]
ocel = "0.1.2"
chrono = { version = "0.4", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
